<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' atw: data: blob:; font-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AtwRead</title>
  <link rel="stylesheet" href="pdf_viewer.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Z M12 5v15"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V4h7l2 3h9v13H3V7Zm0 3h18"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H5v20h14V7l-5-5Zm0 0v6h5M8 12h8M8 16h8"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></symbol>
  </defs></svg>
  <aside id="sidebar">
    <button class="brand" id="brand" title="返回首页"><span class="brand-mark"><svg><use href="#i-book"/></svg></span><span>AtwRead<small>给阅读留一点空间</small></span></button>
    <button id="open" class="primary"><svg><use href="#i-folder"/></svg>打开文件<span class="key">Ctrl O</span></button>
    <div class="side-tabs"><button id="outline-tab" class="active">文档目录</button><button id="recent-tab">最近阅读</button></div>
    <nav id="outline" aria-label="文档目录"><p class="side-empty">打开文档后，<br>在这里浏览它的章节。</p></nav>
    <nav id="recent" aria-label="最近阅读" hidden></nav>
    <div class="sidebar-footer"><span class="local-dot"></span>本地阅读 · 离线可用<span>v0.1</span></div>
  </aside>
  <main>
    <header class="toolbar">
      <button id="toggle-sidebar" class="icon-btn" title="切换侧栏 (Ctrl+B)" aria-label="切换侧栏" aria-expanded="true"><svg><use href="#i-panel"/></svg></button>
      <div class="document-heading"><strong id="document-title">阅读，从这里开始</strong><span id="document-subtitle">你的文档，你的阅读空间</span></div>
      <div id="controls" hidden>
        <div id="page-controls" class="control-group"><button id="prev" class="icon-btn" title="上一页" aria-label="上一页"><svg><use href="#i-left"/></svg></button><input id="page-number" type="number" min="1" value="1" aria-label="页码"><span id="page-total">/ 1</span><button id="next" class="icon-btn" title="下一页" aria-label="下一页"><svg><use href="#i-right"/></svg></button></div>
        <div class="control-group"><button id="zoom-out" class="icon-btn" title="缩小" aria-label="缩小"><svg><use href="#i-minus"/></svg></button><select id="zoom" aria-label="阅读缩放"><option value="page-width">适合宽度</option><option value="page-fit">适合整页</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="zoom-in" class="icon-btn" title="放大" aria-label="放大"><svg><use href="#i-plus"/></svg></button></div>
      </div>
    </header>
    <section id="welcome">
      <div class="welcome-inner"><div class="eyebrow">ATWREAD / 本地阅读器</div><h1>翻开文档，<br><span>专注于每一页。</span></h1><p class="intro">论文、笔记，或一段未读完的故事。<br>把它们放在这里，慢慢读。</p>
      <button id="drop-card"><div class="paper-stack"><span class="paper back">MD</span><span class="paper front"><svg><use href="#i-file"/></svg>PDF</span></div><strong>将文档拖到这里</strong><span>或点击选择本地文件</span><div class="format-tags"><b>PDF</b><b>Markdown</b></div></button>
      <div class="welcome-bottom"><span>无需上传，直接打开</span><span>支持 .pdf · .md · .markdown</span></div>
      <div id="home-recent" hidden><h2>继续阅读</h2><div id="home-recent-list"></div></div>
      </div>
    </section>
    <section id="reading" hidden>
      <div id="pdf-container" tabindex="0" aria-label="PDF 文档" hidden><div id="pdf-viewer" class="pdfViewer"></div></div>
      <div id="md-container" tabindex="0" aria-label="Markdown 文档" hidden><article id="markdown"></article><div class="end-note">— 已读至文末 —</div></div>
    </section>
    <footer class="statusbar"><span id="status">准备就绪</span><span id="progress">PDF & MARKDOWN</span></footer>
  </main>
  <div id="drop-overlay" hidden><svg><use href="#i-folder"/></svg><h2>松开以开始阅读</h2><p>PDF / Markdown</p></div>
  <div id="toast" role="alert" hidden></div>
  <dialog id="password-dialog"><form id="password-form"><h2>这份 PDF 已加密</h2><p id="password-message">输入密码后继续阅读。</p><input id="password" type="password" autocomplete="off" aria-label="PDF 密码"><div class="dialog-actions"><button id="password-cancel" type="button">取消</button><button class="primary" type="submit">打开文档</button></div></form></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
